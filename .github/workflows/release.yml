name: Release desktop packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package and release (for example, v0.2.0)
        required: false
        type: string
      ref:
        description: Git ref to build (defaults to the selected workflow ref)
        required: false
        type: string
      publish:
        description: Create the GitHub release after packaging
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            preset: macos-arm64-package
            generator: ZIP
            extension: zip
          - name: Windows x86_64
            runner: windows-2022
            preset: windows-x86_64-desktop
            generator: ZIP
            extension: zip
            cpack_arguments: -C RelWithDebInfo
          - name: Linux x86_64
            runner: ubuntu-latest
            preset: linux-x86_64-desktop
            generator: TGZ
            extension: tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
          submodules: recursive

      - name: Install macOS parser tools
        if: runner.os == 'macOS'
        run: |
          brew install bison flex
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Install Windows parser tools
        if: runner.os == 'Windows'
        run: choco install winflexbison3 --no-progress --yes

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libfl-dev \
            clang \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxkbcommon-dev libwayland-dev libdecor-0-dev

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Package
        run: >-
          cpack --config build/${{ matrix.preset }}/CPackConfig.cmake
          -G ${{ matrix.generator }} ${{ matrix.cpack_arguments }}

      - name: Verify macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          archive=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -name 'open-engine-simulator-*.zip' -print -quit)
          test -n "$archive"
          mkdir package-check
          ditto -x -k "$archive" package-check
          codesign --verify --deep --strict --verbose=2 package-check/*/engine-sim.app

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}
          path: open-engine-simulator-*.${{ matrix.extension }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: package
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" release-assets/*
          --verify-tag
          --title "Open Engine Simulator $RELEASE_TAG"
          --generate-notes

  publish-web:
    name: Publish web build
    needs: release
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
          submodules: recursive

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Build web host
        run: |
          emcmake cmake --preset web
          cmake --build --preset web --parallel

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          npx wrangler@4 pages deploy build/web/web \
            --project-name=open-engine-sim \
            --commit-hash="$(git rev-parse HEAD)" \
            --commit-message="Release $RELEASE_TAG"
