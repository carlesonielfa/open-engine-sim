name: Portable CMake checks

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  validate:
    name: Validate (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            preset: linux-x86_64-ci
          # Pin an Apple-Silicon host: macos-latest is arm64 today, but an
          # explicit version makes the architecture and CI target unambiguous.
          - name: macOS arm64
            os: macos-15
            preset: macos-arm64-ci
          - name: Windows x86_64
            os: windows-latest
            preset: windows-x86_64-ci
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install macOS parser tools
        if: runner.os == 'macOS'
        run: |
          brew install bison flex
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Install Windows parser tools
        if: runner.os == 'Windows'
        run: |
          choco install winflexbison3 --no-progress --yes
          if (-not (Get-Command win_flex.exe -ErrorAction SilentlyContinue)) {
            throw "winflexbison3 did not provide win_flex.exe"
          }
          if (-not (Get-Command win_bison.exe -ErrorAction SilentlyContinue)) {
            throw "winflexbison3 did not provide win_bison.exe"
          }

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bison flex clang libfl-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxkbcommon-dev libwayland-dev libdecor-0-dev

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run core tests
        run: >-
          ctest --preset ${{ matrix.preset }}
          --exclude-regex SdlAudioOutput

      - name: Run SDL audio smoke test
        run: >-
          ctest --preset ${{ matrix.preset }}
          --tests-regex SdlAudioOutput

  validate-web:
    name: Validate (WebAssembly/WebGL 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Install scripting parser tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes bison flex

      - name: Configure web host
        run: emcmake cmake --preset web

      - name: Build web host
        run: cmake --build --preset web --parallel

      - name: Verify browser bundle
        run: |
          test -f build/web/web/index.html
          test -f build/web/web/index.js
          test -f build/web/web/index.wasm
          test -f build/web/web/index.data
          test -f build/web/web/manifest.webmanifest
